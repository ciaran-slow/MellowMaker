appId: ${APP_ID}
---
# The offline pattern library and ordered editor round-trip (release acceptance
# 4). Everything here is local SQLite, so no connectivity is assumed and the flow
# runs identically on iOS and Android. Fields are selected by testID because an
# accessibility name is not a Maestro id; rows and controls are selected by their
# unique accessible names.
- launchApp:
    clearState: true

# Open the library from a fresh install.
- tapOn: "Patterns"
# A fresh install ships the bundled starter patterns, so the library is never
# empty and "Create your first pattern" does not exist. The always-present
# "New pattern" action is the way in.
# A library row is one accessible element, so the only text it exposes is the
# merged label "<title>. <notes>" (patternLabels.ts). A Maestro text selector is
# a regex matched against that whole string, and the notes carry regex
# metacharacters, so the row is selected as the title plus `.*` - which matches
# under either whole-string or substring semantics and, unlike the bare title,
# cannot make `assertNotVisible` pass vacuously. See
# docs/runbooks/smoke-verification.md section 4.
- assertVisible: "Practice Swatch.*"
- tapOn: "New pattern"
- assertVisible: "New pattern"

# Compose a pattern with a title and two ordered steps.
- tapOn:
    id: "pattern-title-field"
- inputText: "Meadow Wrap"
- tapOn:
    id: "pattern-step-field"
- inputText: "Chain 41"
- tapOn: "Add step"
- assertVisible: "Step 1 of 1: Chain 41"
- tapOn:
    id: "pattern-step-field"
- inputText: "Single crochet across"
- tapOn: "Add step"
- assertVisible: "Step 2 of 2: Single crochet across"
# Creating now lands on the interactive working viewer (Journey B), so step into
# the editor to run the reorder/add/delete round-trip.
- tapOn: "Create pattern"
- assertVisible: "Edit pattern"
- tapOn: "Edit pattern"
- assertVisible: "Step 1 of 2: Chain 41"

# Reorder: moving step 1 down puts "Single crochet across" first.
- tapOn: "Move step 1 down"
- assertVisible: "Step 1 of 2: Single crochet across"

# Add a third step, then delete the first, leaving the exact order behind.
- tapOn:
    id: "pattern-step-field"
- inputText: "Fasten off"
- tapOn: "Add step"
- assertVisible: "Step 3 of 3: Fasten off"
- tapOn: "Delete step 1"
- assertVisible: "Step 1 of 2: Chain 41"
- assertVisible: "Step 2 of 2: Fasten off"

# Relaunch without clearing state to prove the order survives an app restart,
# then reopen the pattern from the library.
- launchApp:
    clearState: false
- tapOn: "Patterns"
- assertVisible: "Meadow Wrap"
# Reopening lands on the viewer; step into the editor to confirm the saved order
# and to delete the pattern.
- tapOn: "Meadow Wrap"
- tapOn: "Edit pattern"
- assertVisible: "Step 1 of 2: Chain 41"
- assertVisible: "Step 2 of 2: Fasten off"

# Delete the whole pattern through the progress-warning confirmation and confirm
# the maker's pattern is gone while the bundled starters remain.
- tapOn: "Delete pattern"
- assertVisible: "Delete this pattern?"
- tapOn: "Yes, delete pattern"
- assertNotVisible: "Meadow Wrap"
- assertVisible: "Practice Swatch.*"

# Issue #44 AC3 on a real binary: deleting a bundled pattern is permanent. The
# seed records what it has inserted in a ledger no cascade can reach, so a true
# process relaunch must not bring the deleted starter back. Only an on-device run
# proves this; the Jest loader suite is the logic proxy.
- tapOn: "Practice Swatch.*"
- tapOn: "Edit pattern"
- tapOn: "Delete pattern"
- assertVisible: "Delete this pattern?"
- tapOn: "Yes, delete pattern"
- assertNotVisible: "Practice Swatch.*"
- launchApp:
    clearState: false
- tapOn: "Patterns"
- assertNotVisible: "Practice Swatch.*"
- assertVisible: "Cotton Dishcloth.*"
