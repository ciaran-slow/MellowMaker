appId: ${APP_ID}
---
# Fresh install: the schema is created before any data-dependent screen is ready.
- launchApp:
    clearState: true
- assertVisible: "Stitches"
- assertVisible: "Your stitch dictionary starts here"
- assertNotVisible: "We couldn't open your saved making data"
# Reopen: the already-migrated database opens again with no error state.
- launchApp:
    clearState: false
- assertVisible: "Stitches"
- assertVisible: "Your stitch dictionary starts here"
- assertNotVisible: "We couldn't open your saved making data"
