appId: ${APP_ID}
---
# The interactive pattern viewer: durable step completion, auto-advance, and
# restart persistence (release acceptance 5; FR-PV-01–06, NFR-02). Everything is
# local SQLite, so no connectivity is assumed and the flow runs identically on
# iOS and Android. Fields are selected by testID; controls and rows by their
# unique accessible names.
- launchApp:
    clearState: true

# From a fresh install, create a pattern with three ordered steps. Creating
# lands on the working viewer (not the editor).
- tapOn: "Patterns"
# A fresh install ships the bundled starter patterns, so the library is never
# empty and "Create your first pattern" does not exist. The always-present
# "New pattern" action is the way in.
# A library row is one accessible element, so the only text it exposes is the
# merged label "<title>. <notes>" (patternLabels.ts). A Maestro text selector is
# a regex matched against that whole string, and the notes carry regex
# metacharacters, so the row is selected as the title plus `.*` - which matches
# under either whole-string or substring semantics and, unlike the bare title,
# cannot make `assertNotVisible` pass vacuously. See
# docs/runbooks/smoke-verification.md section 4.
- assertVisible: "Practice Swatch.*"
- tapOn: "New pattern"
- assertVisible: "New pattern"
- tapOn:
    id: "pattern-title-field"
- inputText: "Test Scarf"
- tapOn:
    id: "pattern-step-field"
- inputText: "Chain 20"
- tapOn: "Add step"
- tapOn:
    id: "pattern-step-field"
- inputText: "Single crochet across"
- tapOn: "Add step"
- tapOn:
    id: "pattern-step-field"
- inputText: "Fasten off"
- tapOn: "Add step"
- tapOn: "Create pattern"

# The viewer opens with the title, the progress summary, and the first step as
# the current step.
- assertVisible: "Test Scarf"
- assertVisible: "0 of 3 steps done"
- assertVisible: "Current step"

# Complete step 1: it becomes Completed, the summary advances, and step 2 becomes
# the current step.
- tapOn: "Mark step 1 complete"
- assertVisible: "Completed"
- assertVisible: "1 of 3 steps done"

# Complete step 2, then relaunch WITHOUT clearing state to prove the writes
# survived an app restart (FR-PV-03 / NFR-02).
- tapOn: "Mark step 2 complete"
- assertVisible: "2 of 3 steps done"
- launchApp:
    clearState: false
- tapOn: "Patterns"
- tapOn: "Test Scarf"

# After restart the completion and the restored position are intact: two steps
# done and step 3 current.
#
# Since issue #56 the title, progress summary, and counter scroll WITH the steps
# as the list's header. Since issue #63 the viewer opens AT the current step
# again: steps 1 and 2 are complete here, so step 3 is current and the reopened
# viewer is EXPECTED to scroll it to the top of the step area, leaving the
# progress summary above the fold.
#
# Three steps all fit in the first render batch, so the list fires
# `onContentSizeChange` exactly once and no later fire arrives. That single fire
# is the content container's own layout event, which Fabric delivers BEFORE the
# layout events of the cells in the same commit, so #63 defers each attempt by
# one task - without that deferral this fixture would measure no cell in time and
# would open at the title instead. Whichever way it lands, the legs below still
# pass: `assertVisible` does not scroll, so each one scrolls its target into view
# first - UP to the summary, then back DOWN to the step - and the UP leg is a
# no-op when the summary is already on screen. So this flow is not itself a bet
# on #63; the landing position is the owner's device check in
# docs/runbooks/deferred-smokes/063-issue-63.md. Every element named is a
# standalone Text node, metacharacter-free, and every assertion here is positive
# (docs/runbooks/smoke-verification.md section 4).
- scrollUntilVisible:
    element:
      text: "2 of 3 steps done"
    direction: UP
- assertVisible: "2 of 3 steps done"
- scrollUntilVisible:
    element:
      text: "Current step"
    direction: DOWN
- assertVisible: "Current step"

# Reopen step 1: it is no longer complete, and the summary falls back. Step 1 is
# now above the fold after the scroll down, and the progress summary scrolls
# with the list, so both are scrolled back up to before they are used.
- scrollUntilVisible:
    element:
      text: "Reopen step 1"
    direction: UP
- tapOn: "Reopen step 1"
- scrollUntilVisible:
    element:
      text: "1 of 3 steps done"
    direction: UP
- assertVisible: "1 of 3 steps done"
